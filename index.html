<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>スペイン語 単語カード</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182033;background:#f6f7fb}
*{box-sizing:border-box}body{margin:0;padding:18px 14px calc(22px + env(safe-area-inset-bottom));min-height:100vh}
main{max-width:620px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:7px 0 20px}
h1{font-size:1.35rem;line-height:1.3;margin:0;font-weight:750}.sub{color:#778095;font-size:.86rem;margin-top:5px}
.count{font-size:.82rem;background:#e9ecf6;border-radius:999px;padding:8px 11px;white-space:nowrap}
.card{background:#fff;border:1px solid #e4e7f0;border-radius:25px;padding:25px 20px 22px;box-shadow:0 12px 35px rgba(28,38,70,.06)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;color:#737d92}
.track{height:6px;background:#edf0f6;border-radius:8px;margin:13px 0 28px;overflow:hidden}.bar{height:100%;width:0;background:#435bd1;transition:width .18s}
.prompt{text-align:center;font-size:.88rem;color:#747e91}
.word{display:flex;align-items:center;justify-content:center;min-height:180px;text-align:center;font-size:clamp(2rem,8vw,3.1rem);font-weight:760;line-height:1.3;overflow-wrap:anywhere;padding:12px 0}
.answer{border-top:1px solid #e8ebf2;margin-top:8px;padding:20px 4px 8px;text-align:center;font-size:clamp(1.15rem,4.7vw,1.45rem);line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.hidden{display:none!important}
button{font:inherit;min-height:50px;border-radius:14px;border:1px solid #dce1ed;background:#fff;color:#1d2740;padding:12px 14px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
.primary{background:#2e439f;border-color:#2e439f;color:white;font-weight:700}
.reveal{width:100%;margin-top:8px}
.feedback{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.known{background:#e9f7ef;border-color:#c8ead5;color:#17663f}.review{background:#fff1e8;border-color:#f5d6c4;color:#8d451f}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.note{font-size:.82rem;color:#778095;line-height:1.65;margin:17px 3px}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.toolbar button{flex:1 1 30%;font-size:.9rem}.clear-row{margin-top:9px}.clear-row button{width:100%;font-size:.9rem;border-color:#f0c8c8;color:#9b3030;background:#fff7f7}
.toast{font-size:.85rem;color:#56627a;text-align:center;min-height:22px;margin-top:12px}
@media(max-width:380px){body{padding-left:10px;padding-right:10px}.card{padding:21px 15px}.word{min-height:150px}}

#entryGate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(246,247,251,.98)}
#entryGate .gate-card{width:100%;max-width:380px;background:#fff;border:1px solid #e2e6f0;border-radius:22px;padding:26px 22px;box-shadow:0 18px 50px rgba(28,38,70,.14);text-align:center}
#entryGate h2{margin:0 0 8px;font-size:1.35rem}
#entryGate p{margin:0 0 18px;color:#778095;font-size:.92rem;line-height:1.6}
#entryKey{width:100%;height:52px;border:1px solid #dce1ed;border-radius:12px;padding:10px 14px;font:inherit;font-size:1.2rem;text-align:center;letter-spacing:.25em;margin-bottom:10px}
#entrySubmit{width:100%}
#entryError{min-height:22px;margin-top:10px;color:#b42318;font-size:.88rem}
body.entry-locked{overflow:hidden}

</style>
</head>
<body class="entry-locked">

<div id="entryGate" role="dialog" aria-modal="true" aria-labelledby="entryTitle">
 <form class="gate-card" id="entryForm">
  <h2 id="entryTitle">入場キーを入力</h2>
  <p>スペイン語単語カードを開くには、入場キーを入力してください。</p>
  <input id="entryKey" type="password" inputmode="numeric" autocomplete="off" placeholder="入場キー" aria-label="入場キー" autofocus>
  <button class="primary" id="entrySubmit" type="submit">入場する</button>
  <div id="entryError" aria-live="polite"></div>
 </form>
</div>

<main>
 <header class="top">
  <div><h1>スペイン語 単語カード</h1><div class="sub">表：スペイン語　／　裏：日本語</div></div>
  <div class="count">全980語</div>
 </header>
 <section class="card">
  <div class="meta"><span id="modeLabel">ランダム出題</span><span id="counter">1 / 980</span></div>
  <div class="track"><div class="bar" id="bar"></div></div>
  <div class="prompt">意味を思い出してから答えを確認</div>
  <div class="word" id="front" lang="es">—</div>
  <div class="answer hidden" id="back" lang="ja"></div>
  <button class="primary reveal" id="reveal">答えを見る</button>
  <div class="feedback">
   <button class="review" id="again" disabled>↻ まだ覚えていない</button>
   <button class="known" id="know" disabled>✓ 覚えた</button>
  </div>
  <div class="nav">
   <button id="prev">← 前へ</button>
   <button class="primary" id="next">次の単語 →</button>
  </div>
 </section>
 <div class="toolbar">
  <button id="reshuffle">⤨ 全単語を再シャッフル</button>
  <button id="missedOnly">苦手だけ復習</button>
  <button id="shuffleMissed">⤨ 苦手リストをシャッフル</button>
 </div>
 <div class="clear-row">
  <button id="clearMissed">苦手リストをすべて消去</button>
 </div>
 <div class="clear-row">
  <button id="clearKnown">覚えたリストをすべて削除</button>
 </div>
 <div class="toast" id="toast" aria-live="polite"></div>
 <p class="note">全単語を一巡するまでは同じ単語を繰り返し出しません。最後まで進むと、もう一度シャッフルできます。学習記録はこのブラウザに保存されます。</p>
</main>
<script>

const entryGate = document.getElementById("entryGate");
document.getElementById("entryForm").addEventListener("submit", function(event) {
  event.preventDefault();
  const entered = document.getElementById("entryKey").value;
  if (entered === "1992") {
    entryGate.remove();
    document.body.classList.remove("entry-locked");
  } else {
    document.getElementById("entryError").textContent = "入場キーが違います。もう一度入力してください。";
    document.getElementById("entryKey").value = "";
    document.getElementById("entryKey").focus();
  }
});

const KEY = "spanish-card-progress-v2";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { progress = {}; }
let order = [], pos = 0, revealed = false, missedMode = false;

function shuffle(a) {
  // Fisher–Yates: every permutation has equal probability.
  const out = a.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress));}catch(e){}}
function startDeck(missed=false){
  missedMode = missed;
  const base = CARDS.map((_,i)=>i).filter(i=>!missed || progress[i]==="again");
  order = shuffle(base);
  pos = 0; revealed = false;
  $("toast").textContent = missed && !order.length ? "苦手として記録した単語はありません。" : "";
  render();
}
function $(id){return document.getElementById(id);}
function render(){
  if(!order.length){
    $("front").textContent = "復習する単語がありません";
    $("back").textContent = "";
    $("back").classList.add("hidden");
    $("reveal").disabled = true; $("again").disabled = true; $("know").disabled = true;
    $("prev").disabled = true; $("next").disabled = true;
    $("counter").textContent = "0 / 0"; $("bar").style.width = "0%";
    $("modeLabel").textContent = "苦手だけ復習";
    return;
  }
  const i=order[pos], c=CARDS[i];
  $("front").textContent=c.es; $("back").textContent=c.ja;
  $("back").classList.toggle("hidden",!revealed);
  $("reveal").textContent=revealed?"答えを隠す":"答えを見る";
  $("again").disabled=!revealed; $("know").disabled=!revealed;
  $("prev").disabled=pos===0;
  $("next").disabled=false;
  $("counter").textContent=(pos+1)+" / "+order.length;
  $("bar").style.width=((pos+1)/order.length*100)+"%";
  $("modeLabel").textContent=missedMode?"苦手だけ復習":"ランダム出題";
}
function mark(value){
  if(!revealed || !order.length) return;
  progress[order[pos]]=value; save();
  $("toast").textContent=value==="known"?"「覚えた」と記録しました":"「まだ覚えていない」と記録しました";
  if(missedMode && value==="known"){
    order.splice(pos,1);
    if(pos>=order.length) pos=Math.max(0,order.length-1);
    revealed=false; render();
  } else {
    if(pos < order.length-1) pos++;
    else {
      $("toast").textContent += "　この一巡は終了です。再シャッフルできます。";
    }
    revealed=false; render();
  }
}
$("reveal").addEventListener("click",()=>{revealed=!revealed;render();});
$("next").addEventListener("click",()=>{
 if(!order.length)return;
 if(pos===order.length-1){$("toast").textContent="一巡完了！「全単語を再シャッフル」を押して次の周回へ。";return;}
 pos++;revealed=false;render();$("toast").textContent="";
});
$("prev").addEventListener("click",()=>{if(pos>0){pos--;revealed=false;render();$("toast").textContent="";}});
$("again").addEventListener("click",()=>mark("again"));
$("know").addEventListener("click",()=>mark("known"));
$("reshuffle").addEventListener("click",()=>startDeck(false));
$("missedOnly").addEventListener("click",()=>startDeck(true));
$("shuffleMissed").addEventListener("click",()=>{
  startDeck(true);
  if(order.length) $("toast").textContent="苦手リストをシャッフルしました。";
});
$("clearMissed").addEventListener("click",()=>{
  const missedCount = Object.values(progress).filter(v=>v==="again").length;
  if(!missedCount){
    $("toast").textContent="消去する苦手単語はありません。";
    return;
  }
  if(!confirm("苦手リストの "+missedCount+" 語をすべて消去しますか？\\n「覚えた」の記録は残ります。")) return;
  for(const key of Object.keys(progress)){
    if(progress[key]==="again") delete progress[key];
  }
  save();
  if(missedMode) startDeck(true);
  else $("toast").textContent="苦手リストを "+missedCount+" 語分、消去しました。";
});
$("clearKnown").addEventListener("click",()=>{
  const knownCount = Object.values(progress).filter(v=>v==="known").length;
  if(!knownCount){
    $("toast").textContent="削除する「覚えた」単語はありません。";
    return;
  }
  if(!confirm("「覚えた」リストの "+knownCount+" 語をすべて削除しますか？\\n苦手リストの記録は残ります。")) return;
  for(const key of Object.keys(progress)){
    if(progress[key]==="known") delete progress[key];
  }
  save();
  if(missedMode) startDeck(true);
  else $("toast").textContent="「覚えた」リストを "+knownCount+" 語分、削除しました。";
});
startDeck(false);
</script>
